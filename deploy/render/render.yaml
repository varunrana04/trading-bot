services:
  - type: web
    name: trading-bot
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 7860
      - key: STARTING_BALANCE
        value: 100000
      - key: MIN_LEVERAGE
        value: 10
      - key: MAX_LEVERAGE
        value: 50
      - key: BOT_API_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: FINSIGHT_ORIGIN
        value: http://localhost:3000  # Update with your FinSight production URL
